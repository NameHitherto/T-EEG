[project]
name = "teebg"
version = "0.1.0"
description = "Python EEG core and API services for T-EEG."
readme = "README.md"
authors = [
    { name = "NameHitherto", email = "605351778@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
